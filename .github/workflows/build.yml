name: Build VST3
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 8.0.4 [https://github.com/juce-framework/JUCE.git](https://github.com/juce-framework/JUCE.git) JUCE
      - run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - run: cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with:
          name: VST3-Plugin
          path: build/*_artefacts/Release/VST3/
